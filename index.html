<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหายา - รพ.สวนผึ้ง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f0f4f8; 
            color: #2c3e50;
        }
        .header-section {
            background: linear-gradient(135deg, #0061ff 0%, #60efff 100%);
            color: white;
            padding: 3rem 1rem;
            border-radius: 0 0 2rem 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .search-box {
            max-width: 700px;
            margin: -2rem auto 0;
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .card-table {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .table thead {
            background-color: #0061ff;
            color: white;
        }
        .badge-preg {
            font-weight: 600;
            padding: 0.4em 0.8em;
        }
        .preg-A { background-color: #2ecc71; color: white; }
        .preg-B { background-color: #3498db; color: white; }
        .preg-C { background-color: #f1c40f; color: black; }
        .preg-D { background-color: #e67e22; color: white; }
        .preg-X { background-color: #e74c3c; color: white; }
        
        .sticky-search {
            position: sticky;
            top: 10px;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="header-section text-center">
    <h1 class="fw-bold">🏥 ระบบสืบค้นรายการยาออนไลน์</h1>
    <p class="lead">กลุ่มงานเภสัชกรรม โรงพยาบาลสวนผึ้ง จ.ราชบุรี</p>
</div>

<div class="container">
    <div class="search-box mb-5">
        <div class="input-group input-group-lg">
            <span class="input-group-text bg-transparent border-end-0">🔍</span>
            <input type="text" id="searchInput" class="form-control border-start-0" placeholder="ค้นหาชื่อยา, ชื่อสามัญ, หรือสรรพคุณ...">
        </div>
        <div id="stats" class="mt-3 text-center text-muted">กำลังโหลดข้อมูลยา...</div>
    </div>

    <div class="card-table">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="drugTable">
                <thead>
                    <tr>
                        <th style="width: 25%;">ชื่อยา</th>
                        <th style="width: 25%;">ชื่อสามัญ</th>
                        <th>ความแรง</th>
                        <th>หน่วย</th>
                        <th>ราคา</th>
                        <th>บัญชี</th>
                        <th>Preg.</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>
    
    <footer class="text-center my-5 text-muted">
        <small>© 2026 กลุ่มงานเภสัชกรรม รพ.สวนผึ้ง | พัฒนาโดย AI Assistant สำหรับคุณสุพจน์</small>
    </footer>
</div>

<script>
    let drugData = [];

    // ดึงข้อมูลจากไฟล์ data.csv
    Papa.parse("data.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            drugData = results.data;
            displayData(drugData);
            updateStats(drugData.length);
        }
    });

    function displayData(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">ไม่พบข้อมูลยาที่ค้นหา</td></tr>';
            return;
        }

        data.forEach(item => {
            const pregClass = item['Pregnancy Cagetory'] ? `preg-${item['Pregnancy Cagetory']}` : 'bg-light text-muted';
            const row = `
                <tr>
                    <td><strong class="text-primary">${item['ชื่อยา'] || '-'}</strong></td>
                    <td><small class="text-secondary">${item['ชื่อสามัญ'] || '-'}</small></td>
                    <td>${item['ความแรง'] || '-'}</td>
                    <td>${item['หน่วยนับ'] || '-'}</td>
                    <td class="fw-bold">${item['ราคาจำหน่าย'] ? parseFloat(item['ราคาจำหน่าย']).toFixed(2) : '0.00'} ฿</td>
                    <td><span class="badge bg-info text-dark">${item['บัญชี'] || '-'}</span></td>
                    <td><span class="badge rounded-pill badge-preg ${pregClass}">${item['Pregnancy Cagetory'] || '-'}</span></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function updateStats(count) {
        document.getElementById('stats').innerHTML = `พบยาในระบบทั้งหมด <strong>${count}</strong> รายการ`;
    }

    // ระบบค้นหาอัจฉริยะ (ค้นหาทันทีที่พิมพ์)
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        const filtered = drugData.filter(item => 
            (item['ชื่อยา'] && item['ชื่อยา'].toLowerCase().includes(term)) ||
            (item['ชื่อสามัญ'] && item['ชื่อสามัญ'].toLowerCase().includes(term)) ||
            (item['Dosage Form'] && item['Dosage Form'].toLowerCase().includes(term))
        );
        displayData(filtered);
        updateStats(filtered.length);
    });
</script>

</body>
</html>
